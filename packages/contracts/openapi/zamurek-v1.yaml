openapi: 3.1.0
info:
  title: ZAMUREK Universal Commerce API
  version: 0.0.0-contract-draft
  description: |
    Contrat de conception ZAMUREK V1, tous métiers et établissements. Brouillon à stabiliser lors de G1.
    Non implémenté. /v1 est version d'URL, les points d'extension multi-activité sont à valider avec les modèles de domaine et les tests.
    X-Zamurek-Channel identifie un canal public, jamais une authentification.
    Les montants sont des chaînes décimales d'unités monétaires mineures.
servers:
  - url: https://api.example.invalid
    description: Exemple fictif non déployé
tags:
  - name: Identity
  - name: Storefront
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Tracking
  - name: Merchant
  - name: Platform
  - name: MerchantIdentity
  - name: Establishments
  - name: UniversalCatalog
  - name: WeightedCommerce
  - name: FoodService
  - name: Appointments
  - name: QuotesAndRepairs
  - name: Venues
  - name: Regulated
  - name: POS
  - name: Agentic
  - name: Subscriptions
paths:
  /auth/v1/register:
    post:
      tags: [Identity]
      operationId: registerCustomer
      summary: Créer un compte client e-mail sans SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomer'
      responses:
        '202':
          description: Demande enregistrée ; ne révèle pas l'existence du compte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcknowledgement'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/v1/verify-email:
    post:
      tags: [Identity]
      operationId: verifyCustomerEmail
      summary: Code de vérification d'e-mail à usage unique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, verificationCode]
              properties:
                email:
                  $ref: '#/components/schemas/EmailAddress'
                verificationCode:
                  type: string
                  minLength: 6
                  maxLength: 128
      responses:
        '200':
          description: Adresse e-mail vérifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcknowledgement'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/v1/login:
    post:
      tags: [Identity]
      operationId: loginCustomer
      summary: Session client authentifiée (réservée aux clients natifs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCredentials'
      responses:
        '200':
          description: Tokens émis seulement après authentification ; jamais journalisés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/v1/refresh:
    post:
      tags: [Identity]
      operationId: refreshCustomerSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Session renouvelée avec rotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/v1/logout:
    post:
      tags: [Identity]
      operationId: logoutCustomer
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session révoquée
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentCustomer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil d'identité globale restreint à son détenteur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/v1/recovery/request:
    post:
      tags: [Identity]
      operationId: requestAccountRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  $ref: '#/components/schemas/EmailAddress'
      responses:
        '202':
          description: Réponse neutre, e-mail envoyé si compte reconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcknowledgement'
  /auth/v1/recovery/confirm:
    post:
      tags: [Identity]
      operationId: confirmAccountRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, recoveryCode, newPassword]
              properties:
                email:
                  $ref: '#/components/schemas/EmailAddress'
                recoveryCode:
                  type: string
                  minLength: 4
                  maxLength: 12
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '200':
          description: Mot de passe modifié et sessions précédentes révoquées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcknowledgement'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/storefront/config:
    get:
      tags: [Storefront]
      operationId: getStorefrontConfig
      summary: Configuration publique de la boutique associée au canal
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Configuration de boutique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontConfig'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Catégories publiques visibles
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Catalogue visible (paginated)
      parameters:
        - $ref: '#/components/parameters/Channel'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page de produits publics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products/{productId}:
    get:
      tags: [Catalog]
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Détail visible du produit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/carts:
    post:
      tags: [Cart]
      operationId: createCart
      summary: Créer panier authentifié ; prix serveur CDF pour marché RDC
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '201':
          description: Panier utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/carts/{cartId}:
    get:
      tags: [Cart]
      operationId: getCart
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Panier du client authentifié uniquement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/carts/{cartId}/items:
    patch:
      tags: [Cart]
      operationId: changeCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variantId, quantity]
              properties:
                variantId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        '200':
          description: Panier recalculé dans sa monnaie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/carts/{cartId}/quote:
    get:
      tags: [Cart]
      operationId: quoteCart
      summary: Devis backend CDF à partir du prix USD et taux marchand versionné
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/CartId'
        - name: fulfillmentMethod
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/FulfillmentMethod'
        - name: deliveryZoneId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Devis CDF avec taux figé, date expiration et détails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/fulfillment/options:
    get:
      tags: [Storefront]
      operationId: listPublicFulfillmentOptions
      summary: Options de livraison et frais CDF calculés par API
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Options de la boutique
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [fulfillmentMethods, deliveryZones, paymentMethods]
                properties:
                  fulfillmentMethods:
                    type: array
                    items:
                      $ref: '#/components/schemas/FulfillmentMethod'
                  deliveryZones:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryZone'
                  paymentMethods:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
  /v1/checkouts:
    post:
      tags: [Checkout]
      operationId: placeOrder
      summary: Créer commande CDF à partir d'un devis serveur versionné
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Commande créée, prix et monnaie figés par serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/orders:
    get:
      tags: [Tracking]
      operationId: listMyOrders
      summary: Commandes du client courant dans la boutique du canal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Commandes visibles au propriétaire authentifié
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderTracking'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orders/{orderId}:
    get:
      tags: [Tracking]
      operationId: getMyOrder
      summary: Détail d'une commande appartenant au client connecté
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Détail de commande après contrôle tenant + ownership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{orderId}/cancellation-requests:
    post:
      tags: [Tracking]
      operationId: requestOrderCancellation
      summary: Déposer une demande ; jamais annuler immédiatement la commande
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '202':
          description: Demande reçue pour examen marchand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcknowledgement'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/merchant/orders:
    get:
      tags: [Merchant]
      operationId: listMerchantOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Commandes du tenant autorisé (représentation réduite)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantOrder'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/merchant/orders/{orderId}/status:
    patch:
      tags: [Merchant]
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Transition acceptée et auditée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantOrder'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/merchant/products/{productId}:
    put:
      tags: [Merchant]
      operationId: replaceMerchantProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProduct'
      responses:
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/merchant/products:
    get:
      tags: [Merchant]
      operationId: listMerchantProducts
      summary: Produits de la boutique, y compris brouillons et masqués
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Catalogue administrable du tenant autorisé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantProduct'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Merchant]
      operationId: createMerchantProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProduct'
      responses:
        '201':
          description: Produit créé dans la boutique du marchand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProduct'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/merchant/orders/{orderId}/payments/{paymentId}/confirm-manual:
    post:
      tags: [Merchant]
      operationId: confirmManualPayment
      summary: Confirmer après vérification humaine un paiement manuel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/OrderId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verificationNote]
              properties:
                verificationNote:
                  type: string
                  minLength: 4
                  maxLength: 500
                externalReference:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: État PAID seulement si méthode manuelle, montant et autorisation vérifiés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantOrder'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/merchant/delivery-zones:
    get:
      tags: [Merchant]
      operationId: listMerchantDeliveryZones
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Zones de livraison du tenant autorisé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantDeliveryZone'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Merchant]
      operationId: createMerchantDeliveryZone
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, baseFeeUsd]
              properties:
                name:
                  type: string
                  minLength: 2
                baseFeeUsd:
                  $ref: '#/components/schemas/Money'
      responses:
        '201':
          description: Zone créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantDeliveryZone'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/merchant/fx-rate:
    get:
      tags: [Merchant]
      operationId: getMerchantFxRate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Taux en vigueur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Merchant]
      operationId: updateMerchantFxRate
      summary: Modifier le taux USD vers CDF et incrémenter la version auditée
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [usdToCdf]
              properties:
                usdToCdf:
                  type: string
                  pattern: '^[0-9]+(\.[0-9]+)?$'
      responses:
        '200':
          description: Taux modifié ; anciennes commandes inchangées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/tenants:
    post:
      tags: [Platform]
      operationId: provisionTenant
      summary: Demander le provisioning idempotent d'un tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, displayName]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,48}$'
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 140
      responses:
        '202':
          description: Provisioning accepté de façon asynchrone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProvisioning'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/tenants/{tenantId}:
    get:
      tags: [Platform]
      operationId: getTenantProvisioning
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: État du provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProvisioning'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /merchant/v1/sessions:
    post:
      tags: [MerchantIdentity]
      operationId: loginMerchantStaff
      summary: loginMerchantStaff — premier contrat typé, à stabiliser en G1
      x-contractStatus: DRAFT
      x-network-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantCredentials'
      responses:
        '201':
          description: Réponse contrôlée par politiques tenant/objet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /merchant/v1/mfa/verify:
    post:
      tags: [MerchantIdentity]
      operationId: verifyMerchantMfa
      summary: verifyMerchantMfa — premier contrat typé, à stabiliser en G1
      x-contractStatus: DRAFT
      x-network-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerification'
      responses:
        '201':
          description: Réponse contrôlée par politiques tenant/objet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/organizations/{organizationId}/establishments:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Establishments]
      operationId: listOrganizationEstablishments
      summary: listOrganizationEstablishments — premier contrat typé, à stabiliser en G1
      x-contractStatus: DRAFT
