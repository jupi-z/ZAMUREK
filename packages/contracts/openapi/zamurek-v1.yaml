components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Channel:
      name: X-Zamurek-Channel
      in: header
      required: true
      description: Identifiant public d'un canal enregistré ; ne confère aucune permission
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentification absente ou session invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ressource ou contexte introuvable, ou volontairement masqué
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: État ou empreinte d'idempotence en conflit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Données invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Boutique désactivée ou service indisponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ResourceId:
      type: string
      format: uuid
    DecimalExact:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: Quantité ou taux décimal encodé en chaîne, sans floating point
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Contact livraison uniquement, pas un identifiant de connexion
    EmailAddress:
      type: string
      format: email
      maxLength: 254
    SupportedCurrency:
      type: string
      enum: [CDF]
      description: Devise commerciale publique autorisée pour le pilote RDC
    RegisterCustomer:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/EmailAddress'
        password:
          type: string
          minLength: 12
          maxLength: 128
    CustomerCredentials:
      $ref: '#/components/schemas/RegisterCustomer'
    AuthTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresInSeconds]
      description: Secrets remis au cœur natif, jamais dans les logs ni dans les événements React
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
    CustomerIdentity:
      type: object
      additionalProperties: false
      required: [id, email, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/EmailAddress'
        emailVerified:
          type: boolean
    GenericAcknowledgement:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
    FxRateSnapshot:
      type: object
      additionalProperties: false
      required: [rateVersion, usdToCdf, effectiveAt]
      properties:
        rateVersion:
          type: integer
          minimum: 1
        usdToCdf:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Taux marchand paramétré, distinct d'un cours officiel BCC
        effectiveAt:
          type: string
          format: date-time
    PriceQuote:
      type: object
      additionalProperties: false
      required: [id, cartId, currencyCode, subtotal, deliveryFee, total, rate, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        cartId:
          type: string
          format: uuid
        currencyCode:
          $ref: '#/components/schemas/SupportedCurrency'
        subtotal:
          $ref: '#/components/schemas/Money'
        deliveryFee:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/FxRateSnapshot'
        expiresAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          example: PRODUCT_UNAVAILABLE
        message:
          type: string
        correlationId:
          type: string
        details:
          type: object
          additionalProperties: true
    Money:
      type: object
      additionalProperties: false
      required: [currency, amountMinor]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [CDF, USD]
        amountMinor:
          type: string
          pattern: '^[0-9]+$'
          description: Entier décimal en unités mineures, toujours positif ou nul
          examples: ['15000']
    StorefrontConfig:
      type: object
      additionalProperties: false
      required: [tenantId, channelId, displayName, publicDisplayCurrency, fulfillmentMethods, paymentMethods, branding]
      properties:
        tenantId:
          type: string
          format: uuid
        channelId:
          type: string
        displayName:
          type: string
        publicDisplayCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        fulfillmentMethods:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentMethod'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        branding:
          type: object
          additionalProperties: false
          required: [primaryColor]
          properties:
            primaryColor:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
            logoUrl:
              type: [string, 'null']
              format: uri
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProductPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        nextCursor:
          type: [string, 'null']
    Product:
      type: object
      additionalProperties: false
      required: [id, name, status, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        categoryId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [ACTIVE, UNAVAILABLE]
          description: Seuls les produits publics apparaissent ici
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Variant'
    Variant:
      type: object
      additionalProperties: false
      required: [id, label, price, available]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        available:
          type: boolean
        price:
          $ref: '#/components/schemas/Money'
          description: Prix CDF commercial calculé par le serveur
    Cart:
      type: object
      additionalProperties: false
      required: [id, currencyCode, items, subtotal, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        currencyCode:
          $ref: '#/components/schemas/SupportedCurrency'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
    CartItem:
      type: object
      additionalProperties: false
      required: [variantId, quantity, lineTotal]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          $ref: '#/components/schemas/Money'
    FulfillmentMethod:
      type: string
      enum: [PICKUP, DELIVERY]
    PaymentMethod:
      type: string
      enum: [PAY_ON_DELIVERY, MANUAL_TRANSFER]
    OrderRecipient:
      type: object
      additionalProperties: false
      required: [fullName, phoneE164]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phoneE164:
          $ref: '#/components/schemas/PhoneE164'
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [cartId, quoteId, recipient, fulfillment, paymentMethod]
      properties:
        cartId:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        recipient:
          $ref: '#/components/schemas/OrderRecipient'
        fulfillment:
          type: object
          additionalProperties: false
          required: [method]
          properties:
            method:
              $ref: '#/components/schemas/FulfillmentMethod'
            deliveryZoneId:
              type: string
              format: uuid
            address:
              type: string
              maxLength: 320
            instructions:
              type: string
              maxLength: 500
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    CheckoutReceipt:
      type: object
      additionalProperties: false
      required: [orderId, orderNumber, status, paymentStatus, total, currencyCode, rate]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        currencyCode:
          $ref: '#/components/schemas/SupportedCurrency'
        total:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/FxRateSnapshot'
    OrderStatus:
      type: string
      enum: [PLACED, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, COMPLETED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [PENDING, AWAITING_CONFIRMATION, PAID, FAILED, CANCELLED, REFUNDED]
    OrderTracking:
      type: object
      additionalProperties: false
      required: [orderId, orderNumber, status, paymentStatus, total]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          $ref: '#/components/schemas/Money'
    MerchantOrder:
      type: object
      additionalProperties: false
      required: [id, number, status, paymentStatus, total, createdAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
    UpsertProduct:
      type: object
      additionalProperties: false
      required: [name, status, variants]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 180
        description:
          type: string
          maxLength: 10000
        status:
          type: string
          enum: [DRAFT, ACTIVE, HIDDEN, UNAVAILABLE, ARCHIVED]
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantInput'
    VariantInput:
      type: object
      additionalProperties: false
      required: [label, basePriceUsd, available]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        basePriceUsd:
          $ref: '#/components/schemas/Money'
          description: Base USD uniquement, validation currency USD côté backend
        available:
          type: boolean
    MerchantVariant:
      type: object
      additionalProperties: false
      required: [id, label, basePriceUsd, available]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        basePriceUsd:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
    MerchantProduct:
      type: object
      additionalProperties: false
      required: [id, name, status, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, HIDDEN, UNAVAILABLE, ARCHIVED]
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MerchantVariant'
    DeliveryZone:
      type: object
      additionalProperties: false
      required: [id, name, fee, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        fee:
          $ref: '#/components/schemas/Money'
          description: Frais CDF calculés par serveur pour l'acheteur
        enabled:
          type: boolean
    MerchantDeliveryZone:
      type: object
      additionalProperties: false
      required: [id, name, baseFeeUsd, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseFeeUsd:
          $ref: '#/components/schemas/Money'
          description: Frais source USD
        enabled:
          type: boolean
    TenantProvisioning:
      type: object
      additionalProperties: false
      required: [tenantId, status]
      properties:
        tenantId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, SUSPENDED, FAILED]
        jobId:
          type: string
          format: uuid

    MerchantCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12}
    MfaVerification:
      type: object
      additionalProperties: false
      required: [challengeId, totp]
      properties:
        challengeId: {$ref: '#/components/schemas/ResourceId'}
        totp: {type: string, minLength: 6, maxLength: 12}
    MerchantSession:
      type: object
      additionalProperties: false
      required: [identityId, mfaVerified, accessToken]
      properties:
        identityId: {$ref: '#/components/schemas/ResourceId'}
        mfaVerified: {type: boolean}
        accessToken: {type: string}
    EstablishmentInput:
      type: object
      additionalProperties: false
      required: [organizationId, name, timezone]
      properties:
        organizationId: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string, minLength: 2}
        timezone: {type: string, description: IANA timezone}
        address: {type: string}
    CapabilityConfig:
      type: object
      additionalProperties: false
      required: [capabilityIds]
      properties:
        capabilityIds:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [RETAIL, WEIGHTED, FOOD, SERVICES, FURNITURE, REPAIRS, PHARMACY]
    Establishment:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, timezone, capabilityIds]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        organizationId: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
        timezone: {type: string}
        capabilityIds: {type: array, items: {type: string}}
    EstablishmentList:
      type: array
      items: {$ref: '#/components/schemas/Establishment'}
    OfferingInput:
      type: object
      additionalProperties: false
      required: [establishmentId, kind, name, basePriceUsd]
      properties:
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        kind:
          type: string
          enum: [PRODUCT, WEIGHTED_PRODUCT, PREPARED_FOOD, SCHEDULED_SERVICE, QUOTED_GOOD, REPAIR_SERVICE, REGULATED_GOOD]
        name: {type: string, minLength: 1}
        basePriceUsd: {$ref: '#/components/schemas/Money'}
        availability: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
    WeightedOfferingInput:
      type: object
      additionalProperties: false
      required: [establishmentId, name, basePriceUsdPerUnit, unitBasis, minimumQuantity, stepQuantity]
      properties:
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string, minLength: 1}
        basePriceUsdPerUnit: {$ref: '#/components/schemas/Money'}
        unitBasis: {type: string, enum: [G, KG]}
        minimumQuantity: {$ref: '#/components/schemas/DecimalExact'}
        stepQuantity: {$ref: '#/components/schemas/DecimalExact'}
    Offering:
      type: object
      additionalProperties: false
      required: [id, establishmentId, kind, name, available]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        kind: {type: string}
        name: {type: string}
        available: {type: boolean}
        publicPriceCdf: {$ref: '#/components/schemas/Money'}
    OfferingList:
      type: array
      items: {$ref: '#/components/schemas/Offering'}
    FoodMenuInput:
      type: object
      additionalProperties: false
      required: [establishmentId, name]
      properties:
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
    FoodMenuItemInput:
      type: object
      additionalProperties: false
      required: [offeringId, modifierGroups]
      properties:
        offeringId: {$ref: '#/components/schemas/ResourceId'}
        modifierGroups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, minSelected, maxSelected]
            properties:
              name: {type: string}
              minSelected: {type: integer, minimum: 0}
              maxSelected: {type: integer, minimum: 1}
    FoodMenu:
      type: object
      additionalProperties: false
      required: [id, establishmentId, name]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
    FoodMenuList:
      type: array
      items: {$ref: '#/components/schemas/FoodMenu'}
    KitchenTransition:
      type: object
      additionalProperties: false
      required: [targetState]
      properties:
        targetState: {type: string, enum: [ACCEPTED, PREPARING, READY, FULFILLED, CANCELLED]}
        reason: {type: string}
    KitchenTicket:
      type: object
      additionalProperties: false
      required: [orderId, state]
      properties:
        orderId: {$ref: '#/components/schemas/ResourceId'}
        state: {type: string}
    ResourceAvailability:
      type: object
      additionalProperties: false
      required: [establishmentId, availableSlots]
      properties:
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        availableSlots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [startsAt, endsAt]
            properties:
              startsAt: {type: string, format: date-time}
              endsAt: {type: string, format: date-time}
              capacity: {type: integer, minimum: 0}
    TableReservationInput:
      type: object
      additionalProperties: false
      required: [establishmentId, partySize, startsAt]
      properties:
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        partySize: {type: integer, minimum: 1}
        startsAt: {type: string, format: date-time}
    AppointmentInput:
      type: object
      additionalProperties: false
      required: [establishmentId, serviceOfferingId, startsAt]
      properties:
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        serviceOfferingId: {$ref: '#/components/schemas/ResourceId'}
        staffId: {$ref: '#/components/schemas/ResourceId'}
        startsAt: {type: string, format: date-time}
    AppointmentTransition:
      type: object
      additionalProperties: false
      required: [targetState]
      properties:
        targetState: {type: string, enum: [CONFIRMED, RESCHEDULED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]}
        newStartsAt: {type: string, format: date-time}
        reason: {type: string}
    BookingReceipt:
      type: object
      additionalProperties: false
      required: [id, establishmentId, state, startsAt]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        state: {type: string}
        startsAt: {type: string, format: date-time}
    BookingList:
      type: array
      items: {$ref: '#/components/schemas/BookingReceipt'}
    QuoteInput:
      type: object
      additionalProperties: false
      required: [establishmentId, scope, baseAmountUsd]
      properties:
        establishmentId: {$ref: '#/components/schemas/ResourceId'}
        scope: {type: string, enum: [BULKY_GOOD, REPAIR, CUSTOM_SERVICE]}
        baseAmountUsd: {$ref: '#/components/schemas/Money'}
        notes: {type: string, maxLength: 2000}
    QuotationAcceptance:
      type: object
      additionalProperties: false
      required: [acceptedRevision]
      properties:
