openapi: 3.1.0
info:
  title: xShop Commerce API
  version: 0.1.0-draft
  description: |
    Contrat initial proposé pour les canaux mono-boutique.
    Non implémenté. /v1 est version d'URL ; la marketplace et les PSP sont hors V1.
    X-Shop-Channel identifie un canal public, jamais une authentification.
    Les montants sont des chaînes décimales d'unités monétaires mineures.
servers:
  - url: https://api.example.invalid
    description: Exemple fictif non déployé
tags:
  - name: Storefront
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Tracking
  - name: Merchant
  - name: Platform
paths:
  /v1/storefront/config:
    get:
      tags: [Storefront]
      operationId: getStorefrontConfig
      summary: Configuration publique de la boutique associée au canal
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Configuration de boutique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontConfig'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Catégories publiques visibles
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Catalogue visible (paginated)
      parameters:
        - $ref: '#/components/parameters/Channel'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page de produits publics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products/{productId}:
    get:
      tags: [Catalog]
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Détail visible du produit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/carts:
    post:
      tags: [Cart]
      operationId: createCart
      summary: Créer un panier temporaire mono-boutique
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '201':
          description: Panier créé ; accessToken secret délivré uniquement ici
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCreated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/carts/{cartId}:
    get:
      tags: [Cart]
      operationId: getCart
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: Panier et prix serveur recalculés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/carts/{cartId}/items:
    patch:
      tags: [Cart]
      operationId: changeCartItem
      summary: Ajouter, modifier ou retirer une variante (quantity=0)
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variantId, quantity]
              properties:
                variantId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        '200':
          description: Panier recalculé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/fulfillment/options:
    get:
      tags: [Storefront]
      operationId: listPublicFulfillmentOptions
      summary: Méthodes publiques de remise, zones et paiements activés par la boutique
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Options applicables lors du checkout
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [fulfillmentMethods, deliveryZones, paymentMethods]
                properties:
                  fulfillmentMethods:
                    type: array
                    items:
                      $ref: '#/components/schemas/FulfillmentMethod'
                  deliveryZones:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryZone'
                  paymentMethods:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/checkouts:
    post:
      tags: [Checkout]
      operationId: placeOrder
      summary: Valider le panier et créer une commande unique
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Commande créée ; token de suivi délivré une seule fois au client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/orders/{orderId}/tracking:
    get:
      tags: [Tracking]
      operationId: trackGuestOrder
      summary: Statut de commande par preuve de possession du token invité
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/TrackingToken'
      responses:
        '200':
          description: Suivi filtré, sans données internes sensibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/merchant/orders:
    get:
      tags: [Merchant]
      operationId: listMerchantOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Commandes du tenant autorisé (représentation réduite)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantOrder'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/merchant/orders/{orderId}/status:
    patch:
      tags: [Merchant]
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Transition acceptée et auditée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantOrder'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/merchant/products/{productId}:
    put:
      tags: [Merchant]
      operationId: replaceMerchantProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProduct'
      responses:
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/merchant/products:
    get:
      tags: [Merchant]
      operationId: listMerchantProducts
      summary: Produits de la boutique, y compris brouillons et masqués
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Catalogue administrable du tenant autorisé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantProduct'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Merchant]
      operationId: createMerchantProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProduct'
      responses:
        '201':
          description: Produit créé dans la boutique du marchand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProduct'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/merchant/orders/{orderId}/payments/{paymentId}/confirm-manual:
    post:
      tags: [Merchant]
      operationId: confirmManualPayment
      summary: Confirmer après vérification humaine un paiement manuel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/OrderId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verificationNote]
              properties:
                verificationNote:
                  type: string
                  minLength: 4
                  maxLength: 500
                externalReference:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: État PAID seulement si méthode manuelle, montant et autorisation vérifiés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantOrder'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/merchant/delivery-zones:
    get:
      tags: [Merchant]
      operationId: listMerchantDeliveryZones
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: Zones de livraison du tenant autorisé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryZone'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Merchant]
      operationId: createMerchantDeliveryZone
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Channel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, fee]
              properties:
                name:
                  type: string
                  minLength: 2
                fee:
                  $ref: '#/components/schemas/Money'
      responses:
        '201':
          description: Zone créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/v1/tenants:
    post:
      tags: [Platform]
      operationId: provisionTenant
      summary: Demander le provisioning idempotent d'un tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, displayName]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,48}$'
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 140
      responses:
        '202':
          description: Provisioning accepté de façon asynchrone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProvisioning'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/v1/tenants/{tenantId}:
    get:
      tags: [Platform]
      operationId: getTenantProvisioning
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: État du provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProvisioning'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Channel:
      name: X-Shop-Channel
      in: header
      required: true
      description: Identifiant public d'un canal enregistré ; ne confère aucune permission
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CartToken:
      name: X-Cart-Token
      in: header
      required: true
      description: Jeton secret de session de panier, distinct de l'ID ; stockage serveur sous hash
      schema:
        type: string
        minLength: 32
    TrackingToken:
      name: X-Order-Tracking-Token
      in: header
      required: true
      description: Secret de consultation invité ; ne pas placer en URL
      schema:
        type: string
        minLength: 32
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Ressource ou contexte introuvable, ou volontairement masqué
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: État ou empreinte d'idempotence en conflit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Données invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Boutique désactivée ou service indisponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          example: PRODUCT_UNAVAILABLE
        message:
          type: string
        correlationId:
          type: string
        details:
          type: object
          additionalProperties: true
    Money:
      type: object
      additionalProperties: false
      required: [currency, amountMinor]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [CDF, USD]
        amountMinor:
          type: string
          pattern: '^[0-9]+$'
          description: Entier décimal en unités mineures, toujours positif ou nul
          examples: ['15000']
    StorefrontConfig:
      type: object
      additionalProperties: false
      required: [tenantId, channelId, displayName, currency, fulfillmentMethods, paymentMethods, branding]
      properties:
        tenantId:
          type: string
          format: uuid
        channelId:
          type: string
        displayName:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        fulfillmentMethods:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentMethod'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        branding:
          type: object
          additionalProperties: false
          required: [primaryColor]
          properties:
            primaryColor:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
            logoUrl:
              type: [string, 'null']
              format: uri
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProductPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        nextCursor:
          type: [string, 'null']
    Product:
      type: object
      additionalProperties: false
      required: [id, name, status, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        categoryId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [ACTIVE, UNAVAILABLE]
          description: Seuls les produits publics apparaissent ici
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Variant'
    Variant:
      type: object
      additionalProperties: false
      required: [id, label, price, available]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        available:
          type: boolean
        price:
          $ref: '#/components/schemas/Money'
    CartCreated:
      type: object
      additionalProperties: false
      required: [cart, accessToken]
      description: accessToken secret n'est délivré qu'à la création et doit être conservé côté Kotlin
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        accessToken:
          type: string
          minLength: 32
    Cart:
      type: object
      additionalProperties: false
      required: [id, items, subtotal, expiresAt]
      description: Réponse de lecture/modification sans rediffusion du jeton secret
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
    CartItem:
      type: object
      additionalProperties: false
      required: [variantId, quantity, lineTotal]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          $ref: '#/components/schemas/Money'
    FulfillmentMethod:
      type: string
      enum: [PICKUP, DELIVERY]
    PaymentMethod:
      type: string
      enum: [PAY_ON_DELIVERY, MANUAL_TRANSFER]
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [cartId, customer, fulfillment, paymentMethod]
      properties:
        cartId:
          type: string
          format: uuid
        customer:
          type: object
          additionalProperties: false
          required: [name, phone]
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            phone:
              type: string
              minLength: 6
              maxLength: 32
        fulfillment:
          type: object
          additionalProperties: false
          required: [method]
          properties:
            method:
              $ref: '#/components/schemas/FulfillmentMethod'
            deliveryZoneId:
              type: string
              format: uuid
            address:
              type: string
              maxLength: 320
            instructions:
              type: string
              maxLength: 500
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    CheckoutReceipt:
      type: object
      additionalProperties: false
      required: [orderId, orderNumber, status, paymentStatus, total, trackingToken]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          $ref: '#/components/schemas/Money'
        trackingToken:
          type: string
          description: Secret délivré lors de l'initialisation et repris seulement sur retry idempotent autorisé
    OrderStatus:
      type: string
      enum: [PLACED, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, COMPLETED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [PENDING, AWAITING_CONFIRMATION, PAID, FAILED, CANCELLED, REFUNDED]
    OrderTracking:
      type: object
      additionalProperties: false
      required: [orderId, orderNumber, status, paymentStatus, total]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          $ref: '#/components/schemas/Money'
    MerchantOrder:
      type: object
      additionalProperties: false
      required: [id, number, status, paymentStatus, total, createdAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
    UpsertProduct:
      type: object
      additionalProperties: false
      required: [name, status, variants]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 180
        description:
          type: string
          maxLength: 10000
        status:
          type: string
          enum: [DRAFT, ACTIVE, HIDDEN, UNAVAILABLE, ARCHIVED]
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VariantInput'
    VariantInput:
      type: object
      additionalProperties: false
      required: [label, price, available]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
    MerchantProduct:
      type: object
      additionalProperties: false
      required: [id, name, status, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, HIDDEN, UNAVAILABLE, ARCHIVED]
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    DeliveryZone:
      type: object
      additionalProperties: false
      required: [id, name, fee, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        fee:
          $ref: '#/components/schemas/Money'
        enabled:
          type: boolean
    TenantProvisioning:
      type: object
      additionalProperties: false
