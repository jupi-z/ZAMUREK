<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="zm-zil-001-title zm-zil-001-desc" width="800" height="600" viewBox="0 0 800 600" fill="none" data-zamurek-illustration="ZIL-001" data-theme="dark" data-motion="on">
<title id="zm-zil-001-title">Panier vide</title><desc id="zm-zil-001-desc">Illustration SVG vectorielle modulaire Zamurek. Provenance : Original Zamurek design. Aucun paiement confirmé implicite.</desc>
<defs><linearGradient id="zm-zil-001-basket" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#168C70"/><stop offset=".56" stop-color="#005C45"/><stop offset="1" stop-color="#003E32"/></linearGradient><linearGradient id="zm-zil-001-warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB85E"/><stop offset=".8" stop-color="#FF8A1E"/><stop offset="1" stop-color="#E06711"/></linearGradient><linearGradient id="zm-zil-001-mag" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#F7619C"/><stop offset="1" stop-color="#D21868"/></linearGradient></defs>
<style><![CDATA[
:root{color-scheme:light dark}
.zm-shape{vector-effect:non-scaling-stroke}
#zm-zil-001-phone,#zm-zil-001-handle,#zm-zil-001-drawer,#zm-zil-001-receipt,#zm-zil-001-spark,#zm-zil-001-bag,#zm-zil-001-search,#zm-zil-001-heart{transform-box:fill-box;transform-origin:center}

#zm-zil-001-phone{animation:zm-zil-001-phone-tilt 3.6s ease-in-out 1}
#zm-zil-001-handle{animation:zm-zil-001-handle-nudge 2.3s ease-out 1}
#zm-zil-001-drawer{animation:zm-zil-001-drawer-open 1.1s cubic-bezier(.22,.7,.22,1) 1}
#zm-zil-001-receipt{animation:zm-zil-001-receipt-out 1.3s ease-out 1}
#zm-zil-001-spark{animation:zm-zil-001-appear 1.4s ease-out 1}
#zm-zil-001-bag{animation:zm-zil-001-bag-hover 2.6s ease-in-out 1}
#zm-zil-001-search{animation:zm-zil-001-appear 1s ease-out 1}
#zm-zil-001-heart{animation:zm-zil-001-appear 1.4s ease-out 1}
@keyframes zm-zil-001-phone-tilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}}
@keyframes zm-zil-001-handle-nudge{0%,100%{transform:rotate(0)}35%{transform:rotate(-8deg)}}
@keyframes zm-zil-001-drawer-open{0%{transform:translateY(-10px);opacity:.68}100%{transform:translateY(0);opacity:1}}
@keyframes zm-zil-001-receipt-out{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes zm-zil-001-appear{0%{opacity:0;transform:scale(.87)}100%{opacity:1;transform:scale(1)}}
@keyframes zm-zil-001-bag-hover{0%,100%{transform:translateY(0)}45%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

]]></style>

