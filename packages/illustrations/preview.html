<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zamurek · pilotes SVG</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111318;font:15px/1.5 system-ui,sans-serif}header{padding:24px 4vw;border-bottom:1px solid #d7e5dd;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:22px;margin:0}p{margin:6px 0 0;color:#567266}button{border:1px solid #005c45;background:#005c45;color:white;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}main{padding:24px 4vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.sample{border:1px solid #dae8e0;border-radius:16px;padding:16px;background:#fff}.sample h2{font-size:16px;margin:0}.sample img{width:100%;display:block;aspect-ratio:4/3;object-fit:contain}.sample small{color:#517065}.dark{background:#111318;color:#f0f7f3}.dark p{color:#bdcfc4}.dark header{border-color:#395148}.dark .sample{background:#18231e;border-color:#365044}.dark .sample small{color:#adccbc}</style></head><body><header><div><h1>Zamurek · Trois pilotes SVG</h1><p>Humaaans + IRA Design · vecteurs natifs sans raster · revue visuelle</p></div><button id="toggle">Fond obsidienne</button></header><main id="grid"></main><script>const samples=[['ZIL-001','Panier vide'],['ZIL-044','Bienvenue acheteur'],['ZIL-117','Ouverture de caisse']];let dark=false;const grid=document.getElementById('grid');function render(){document.body.classList.toggle('dark',dark);grid.innerHTML=samples.map(([id,name])=>'<section class="sample"><h2>'+id+' · '+name+'</h2><img alt="'+name+' fixe" src="assets/static/'+id.toLowerCase()+'-'+(dark?'dark':'light')+'.svg"><small>Statique</small><hr><img alt="'+name+' animé" src="assets/motion/'+id.toLowerCase()+'-'+(dark?'dark':'light')+'.svg"><small>Animation ponctuelle</small></section>').join('');document.getElementById('toggle').textContent=dark?'Fond blanc':'Fond obsidienne'}document.getElementById('toggle').onclick=()=>{dark=!dark;render()};render();</script></body></html>
