name: One-time cleanup of retired Zamurek illustration branches
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-retired-illustration-branches.yml"]
permissions:
  contents: write
jobs:
  remove-retired-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove branches containing deferred illustration project names
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "docs/illustrations-master-backlog-v1-20261030" \
            "feat/illustrations-ira-humaaans-only-257-20261030" \
            "feat/illustrations-pilotes-humaaans-ira-20261030"; do
            echo "Removing retired branch: ${branch}"
            git push origin --delete "${branch}"
          done
