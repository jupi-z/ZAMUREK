name: documentation-check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAPI validator
        run: python3 -m pip install -r scripts/requirements-docs.txt
      - name: Validate repository docs
        run: python3 scripts/validate_docs.py
      - name: Validate OpenAPI contract
        run: python3 scripts/validate_openapi.py

