name: zamurek-specification-check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python3 -m pip install -r scripts/requirements-docs.txt
      - name: Validate markdown and repository structure
        run: python3 scripts/validate_docs.py
      - name: Validate 43-capability V1 manifest and progress gates
        run: python3 scripts/validate_v1_scope.py
      - name: Validate shared Monarque Connect Core and POS architecture
        run: python3 scripts/validate_convergence.py
      - name: Validate Agentic tool and event JSON Schema drafts
        run: python3 scripts/validate_agent_contracts.py
      - name: Validate ZAMUREK V1 OpenAPI draft and invariants
        run: python3 scripts/validate_openapi.py
      - name: Validate brand assets, palette and theme variants
        run: python3 scripts/validate_branding.py
      - name: Validate Zamurek Matière iconography assets, SVG sprites and capability mapping
        run: python3 scripts/validate_iconography.py
      - name: Validate ZAMUREK illustration design backlog
        run: python3 scripts/validate_illustrations_backlog.py
